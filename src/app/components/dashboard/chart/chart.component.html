<div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm w-full">

  <div class="flex justify-between items-center mb-6">
    <div>
      <h3 class="text-base font-bold text-slate-800">Tendance Mensuelle des Stocks et Mouvements</h3>
    </div>


  </div>

  <div class="flex items-center justify-center gap-6 mb-4 text-xs font-semibold text-slate-600">
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 bg-green-500 rounded-sm"></span> Entrées
    </div>
    <div class="flex items-center gap-1.5">
      <span class="w-3 h-3 bg-red-500 rounded-sm"></span> Sorties
    </div>
  </div>

  <div class="h-64 w-full relative">
    <canvas
      baseChart
      [data]="chartData"
      [options]="chartOptions"
      [type]="chartType">
    </canvas>
  </div>

</div>
