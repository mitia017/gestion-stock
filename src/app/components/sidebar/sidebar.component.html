<div class="w-64 h-full text-slate-300 flex flex-col flex-shrink-0 overflow-y-auto border-r border-slate-800 bg-[#2e4491] font-sans">
  <div class="space-y-2 flex flex-col">
    <a class="flex justify-around w-full item-center gap-2" routerLink="/">
      <fa-icon [icon]="iconStock" size="xl" class="text-white my-2 ml-3"></fa-icon>
      <h1 class="text-2xl font-bold text-white my-1 mx-3">Stock <span class="text-red-300">Pro</span></h1>
    </a>
    <div class="flex flex-col text-md space-y-1 text-white px-2 pt-4">
      <a routerLink="/dashboard" routerLinkActive="active" class="hover-side px-3">
        <fa-icon [icon]="iconEntrepot" size="sm" class="text-white m-2"></fa-icon>
        Dashboard
      </a>
      <a routerLink="/inventaire" routerLinkActive="active" class="hover-side px-3">
        <fa-icon [icon]="iconArrivage" size="sm" class="text-white m-2"></fa-icon>
        Inventaire
      </a>
      <a routerLink="/categorie" routerLinkActive="active" class="hover-side px-3">
        <fa-icon [icon]="iconCategorie" size="sm" class="text-white m-2"></fa-icon>
        Categorie
      </a>
      <a routerLink="/mouvements" routerLinkActive="active" class="hover-side px-3">
        <fa-icon [icon]="iconTransaction" size="sm" class="text-white m-2"></fa-icon>
        Entrée/Sortie
      </a>

    </div>
  </div>
</div>
