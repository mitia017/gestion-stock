<div class="w-full max-w-lg mx-auto mt-8 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="px-6 py-4 bg-emerald-50 border-b border-emerald-100">
    <h2 class="text-lg font-bold text-emerald-800">➕ Bon d'Entrée de Marchandise</h2>
    <p class="text-xs text-emerald-600 mt-0.5">Augmenter le stock d'un produit (Réception fournisseur, retour...)</p>
  </div>

  <form [formGroup]="entreeForm" (ngSubmit bag)="onSubmit()" class="p-6 space-y-4">
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Sélectionner l'article *</label>
      <select formControlName="produitId" class="w-full p-2.5 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        <option value="" disabled>Choisir un produit...</option>
        @for (p of produits; track p.id) {
        <option [value]="p.id">{{ p.nom }} (Stock actuel: {{ p.quantiteStock }})</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Quantité reçue *</label>
      <input type="number" formControlName="quantite" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>

    <div>
      <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Motif / Justification de l'entrée *</label>
      <input type="text" formControlName="description" placeholder="Ex: Livraison Facture N°FR-442" class="w-full p-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
      <a routerLink="/mouvements" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg">Annuler</a>
      <button type="submit" [disabled]="entreeForm.invalid" class="px-5 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 disabled:bg-gray-200 rounded-lg cursor-pointer">
        Valider l'Entrée
      </button>
    </div>
  </form>
</div>
