<div class="w-full max-w-md mx-auto mt-10 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

  <div class="px-6 py-4 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
    <div>
      <h2 class="text-xl font-bold text-gray-800">Modifier la catégorie</h2>
      <p class="text-xs text-gray-500 mt-0.5">Appliquer les corrections sur le libellé de la fiche #{{ categorieId }}</p>
    </div>
    <a routerLink="/categorie" class="text-sm text-blue-600 hover:text-blue-800 font-medium">
      &larr; Annuler
    </a>
  </div>

  <form [formGroup]="categorieForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
    <div>
      <label class="block text-xs font-semibold uppercase text-gray-500 mb-1">Nom de la catégorie *</label>
      <input type="text" formControlName="nom"
             class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white"
             [ngClass]="{'border-red-500 ring-1 ring-red-500': categorieForm.get('nom')?.touched && categorieForm.get('nom')?.invalid}">

      @if (categorieForm.get('nom')?.touched && categorieForm.get('nom')?.invalid) {
      <p class="text-xs text-red-500 mt-1 font-medium">Le nom révisé doit comporter au moins 3 caractères.</p>
      }
    </div>

    <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
      <a routerLink="/categorie" class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
        Fermer
      </a>
      <button type="submit" [disabled]="categorieForm.invalid"
              class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 rounded-lg shadow-sm transition-colors cursor-pointer">
        Enregistrer les modifications
      </button>
    </div>
  </form>
</div>
